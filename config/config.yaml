# -------------PROJECT NAME------------- 
project_name: "project_name"

# -------------PIPELINE RESOURCES-------------
#Set the paths to your input files (these may also be in the output directory).
accession_list: "/pathto/accession_list.txt"
taxon_list: "/pathto/taxon_list.txt"

#-------------RULES TO USE-------------

#Run get_accessions_from_taxa by itself first if you have a taxa_list input. Otherwise, proceed to download_references and beyond. 
get_accessions_from_taxa: True

download_references: False

replace_headers: False

#If you have decided to replace your headers, you must leave replace_headers as True when running build_acc2taxid and build_bowtie_index.
build_acc2taxid: False

#You can run build_bowtie_index immediately if you feel brave, or run it separately once you are happy with your database.
build_bowtie_index: False
